name: Build KernelPatch LKMs (matrix)

on:
  workflow_dispatch:
  push:
    paths:
      - 'lkm/**'
  pull_request:
    paths:
      - 'lkm/**'

jobs:
  build-lkm:
    strategy:
      matrix:
        include:
          - kmi: android12-5.10
            ddk_release: '20260313'
          - kmi: android13-5.10
            ddk_release: '20260313'
          - kmi: android13-5.15
            ddk_release: '20260313'
          - kmi: android14-5.15
            ddk_release: '20260313'
          - kmi: android14-6.1
            ddk_release: '20260313'
          - kmi: android15-6.6
            ddk_release: '20260313'
          - kmi: android16-6.12
            ddk_release: '20260313'
          - kmi: android17-6.18
            ddk_release: '20260828'
    uses: ./.github/workflows/build-ddk.yml
    with:
      kmi: ${{ matrix.kmi }}
      ddk_release: ${{ matrix.ddk_release }}

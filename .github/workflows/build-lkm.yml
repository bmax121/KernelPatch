name: Build KernelPatch LKMs (matrix)

on:
  workflow_dispatch:
  push:
    paths:
      - 'lkm/**'
  pull_request:
    paths:
      - 'lkm/**'

jobs:
  build-lkm:
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    uses: ./.github/workflows/build-ddk.yml
    with:
      kmi: ${{ matrix.kmi }}
      ddk_release: '20260313'
